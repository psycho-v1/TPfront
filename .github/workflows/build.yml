name: Build footer
on:
  push:
    branches: [main]
    paths: ["src/**", "brand/**", "build.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit built footer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist theme
          git diff --cached --quiet || (git commit -m "Rebuild footer" && git push)
